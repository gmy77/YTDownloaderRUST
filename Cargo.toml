[package]
name = "ytdownloader-rust"
version = "0.1.1"
edition = "2021"
description = "Scarica video, audio e sottotitoli da YouTube; interfaccia ispirata a YoutubeDownloader di Tyrrrz, motore yt-dlp"
publish = false

[[bin]]
name = "ytdownloader-rust"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "persistence", "accesskit"] }
egui_extras = { version = "0.31.1", features = ["image", "http"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ehttp = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Aspetto Windows 11: handle della finestra per DWM (Mica, barra del titolo, angoli) e accento di sistema.
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_System_Registry"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
lto = "thin"
